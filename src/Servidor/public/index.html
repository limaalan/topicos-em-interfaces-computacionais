<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoramente de temperatura</title>
  <style>
  </style>
</head>
<body>
  <h1>Leitura atual : </h1>
    <div id="result"> </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let placas = [];

    socket.on('atualizar-dados', ({ id, temp, humidade }) => {
      
      
      if (!placas.includes(id)){
        var newItem = document.createElement('h2');
        newItem.id = `placa${id}`
        document.getElementById("result").appendChild(newItem)
        placas.push(id);
      }
      if (placas.length>0){
        placas.map((placa)=>{
          document.getElementById(`placa${id}`).innerText = `Placa: ${id} temperatura : ${temp} humidade : ${humidade}`;
          console.log(`placa${placa}`)
        })
      }
    });


  </script>
</body>
</html>
